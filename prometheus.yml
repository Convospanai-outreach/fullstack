global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'craftmyfunnel-nextjs'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']
    scheme: http

  - job_name: 'micro-llm'
    static_configs:
      - targets: ['host.docker.internal:8081']  # If llama.cpp exposes metrics
