version: '3.8'

services:
  app:
    build: .
    restart: always
    environment:
      - DATABASE_URL=postgresql://convouser:convopassword@postgres:5432/convodb
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:80
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme_in_prod}
    depends_on:
      - postgres
      - redis
    networks:
      - convo-network

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: convouser
      POSTGRES_PASSWORD: convopassword
      POSTGRES_DB: convodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - convo-network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - convo-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - convo-network

networks:
  convo-network:
    driver: bridge

volumes:
  postgres_data:
