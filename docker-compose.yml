services:
  # Service 0: Database (The Sovereignty Layer Persistence)
  db:
    image: pgvector/pgvector:pg16
    container_name: craftmyfunnel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: craftmyfunnel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 0.5: UAE Data Residency Shard (Physical Separation)
  db-uae:
    image: pgvector/pgvector:pg16
    container_name: craftmyfunnel-postgres-uae
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: craftmyfunnel_uae
    ports:
      - "5434:5432"
    volumes:
      - pgdata_uae:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # This file provides the local datastores only. `npm run beta:start` starts
  # `db` and `redis` from here and runs web/api/worker as host processes; the
  # full containerised stack lives in apps/docker-compose.split.yml.
  #
  # The former craftmyfunnel-web, edge-node-sim, browser-node, and worker
  # services were removed: they predate the apps/* split, referenced a
  # ./services/edge-node build context that no longer exists, and mounted the
  # host Docker socket into the web container.

  # Service 5: Redis Cache (Session & Queue)
  redis:
    image: redis:7-alpine
    container_name: craftmyfunnel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  pgdata:
  pgdata_uae:
  redis_data:
