version: 2

updates:
  # Workflow actions are pinned to commit SHAs (`uses: owner/action@<sha> # vX`), which never
  # move on their own. Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
