name: Neon Preview Branch Governance

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  preview_branch_governance:
    name: Preview Branch Ownership
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Record preview branch owner
        shell: bash
        run: |
          {
            echo "## Neon preview branch governance"
            echo
            echo "Preview Neon branches are provisioned by the Vercel/Neon integration."
            echo "This workflow intentionally performs no Neon branch create/delete operation."
            echo
            echo "- GitHub Actions does not create PR-scoped Neon preview branches."
            echo "- GitHub Actions does not delete Neon branches on PR close."
            echo "- Existing branches require manual review before cleanup."
            echo "- Neon default-parent settings are unchanged by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
