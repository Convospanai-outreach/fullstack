name: Deploy web to Render (batched)

# Render's own auto-deploy builds every commit pushed to main, and each build
# (no-cache npm install + next build) uses pipeline minutes. With auto-deploy
# turned off in Render, this workflow starts one deploy per run instead, and
# only when something the web build depends on changed since the last deploy.
#
# Setup (once): in Render, set craftmyfunnel-web Auto-Deploy to "Off", create a
# Deploy Hook, and save its URL as the repository secret RENDER_DEPLOY_HOOK_URL.
#
# The last deployed commit is remembered as the git tag render-deployed.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if no web files changed since the last deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-render
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to deploy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          head=$(git rev-parse HEAD)
          echo "sha=$head" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" != "true" ] && git rev-parse -q --verify refs/tags/render-deployed >/dev/null; then
            last=$(git rev-parse render-deployed^{commit})
            if [ -z "$(git diff --name-only "$last" "$head" -- apps/web packages package.json package-lock.json)" ]; then
              echo "No web files changed since $last; nothing to deploy."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Only deploy a commit whose CI Gate passed.
          gate=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI Gate")][0].conclusion')
          if [ "$gate" != "success" ]; then
            echo "CI Gate on $head is '${gate:-missing}'; will retry on the next run."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: steps.plan.outputs.deploy == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "${HOOK}&ref=${SHA}"
          git tag -f render-deployed "$SHA"
          git push -f origin refs/tags/render-deployed
