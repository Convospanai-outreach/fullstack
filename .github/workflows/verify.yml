name: Phi-3 Verification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  verify-micro-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Run CI Verification
        run: |
          chmod +x scripts/verify_ci.sh
          ./scripts/verify_ci.sh
      
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: verification-logs
          path: |
            *.log
            evaluation/*.log
          retention-days: 30
      
      - name: Fail on verification failure
        if: failure()
        run: |
          echo "::error::Phi-3 verification failed. Review logs for details."
          exit 1
