name: Vercel Parity Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: vercel-parity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-docs-only:
    name: Docs-only Change Detection
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          changed=""

          if [[ "$event" == "pull_request" ]]; then
            git fetch --no-tags --prune origin "${{ github.base_ref }}"
            changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)" || changed=""
          elif [[ "$event" == "push" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              changed="$(git diff --name-only "$before" "$after")"
            fi
          fi

          docs_only=true
          if [[ -z "$changed" ]]; then
            docs_only=false
          else
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                docs/*|README.md|.github/pull_request_template.md|.github/ISSUE_TEMPLATE/*)
                  ;;
                *.md)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done <<< "$changed"
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Docs-only classification: $docs_only" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$changed" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Changed files:" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$changed" >> "$GITHUB_STEP_SUMMARY"
          fi

  docs-only-validation:
    name: Docs-only Validation
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm docs-only Vercel parity skip
        run: |
          echo "Docs-only change set detected."
          echo "Skipping Vercel Parity Build."

  vercel-parity-build:
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies from repo root
        run: npm ci

      - name: Block unsafe Prisma imports in web
        run: node scripts/check-web-prisma-imports.mjs

      - name: Generate Prisma Client (build-only, no real DB)
        working-directory: apps/web
        run: npx prisma generate --config prisma/prisma.config.ts --schema prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dummy"

      - name: Run exact Vercel web build
        working-directory: apps/web
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
          SKIP_ENV_VALIDATION: "true"
          NEXTAUTH_SECRET: "ci-parity-secret-not-real"
          NEXTAUTH_URL: "http://localhost:3000"

  vercel-parity-gate:
    name: Vercel Parity Gate
    needs: [detect-docs-only, docs-only-validation, vercel-parity-build]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            if [ "${{ needs.docs-only-validation.result }}" != "success" ]; then
              echo "::error::Docs-only validation did not complete successfully."
              exit 1
            fi
          else
            if [ "${{ needs.vercel-parity-build.result }}" != "success" ]; then
              echo "::error::Vercel Parity Build did not complete successfully."
              exit 1
            fi
          fi
          echo "Vercel Parity Gate passed."
