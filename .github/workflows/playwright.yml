
name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: convospan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma Client & Push Schema
      run: |
        npx prisma generate
        npx prisma db push --skip-generate
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/convospan
    
    - name: Create test user
      run: npx tsx scripts/create-test-user.ts
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/convospan
    
    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/convospan
        NEXTAUTH_SECRET: ci-playwright-secret
        NEXTAUTH_URL: http://localhost:3000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npx playwright test
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/convospan
        NEXTAUTH_SECRET: ci-playwright-secret
        NEXTAUTH_URL: http://localhost:3000
        TEST_USER_EMAIL: audit_user@example.com
        TEST_USER_PASSWORD: AuditPassword123!
    
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
