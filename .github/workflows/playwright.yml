
name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
# Node.js 24 native runtimes active via v6+ actions
jobs:
  test:
    name: Playwright (apps/web)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: convospan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: npm ci --workspace apps/web --include-workspace-root --no-audit --no-fund --legacy-peer-deps
    
    - name: Generate Prisma Client & Push Schema
      working-directory: apps/web
      run: |
        npx prisma generate
        npx prisma db push
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/convospan
    
    - name: Create test user
      working-directory: apps/web
      run: npx tsx scripts/create-test-user.ts
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/convospan
    
    - name: Build application
      working-directory: apps/web
      run: npm run build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/convospan
        NEXTAUTH_SECRET: ci-playwright-secret
        NEXTAUTH_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:3001
        REDIS_URL: redis://localhost:6379
    
    - name: Install Playwright Browsers
      working-directory: apps/web
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      working-directory: apps/web
      run: npx playwright test
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/convospan
        NEXTAUTH_SECRET: ci-playwright-secret
        NEXTAUTH_URL: http://localhost:3000
        TEST_USER_EMAIL: audit_user@example.com
        TEST_USER_PASSWORD: AuditPassword123!
        REDIS_URL: redis://localhost:6379
    
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: apps/web/playwright-report/
        retention-days: 30
