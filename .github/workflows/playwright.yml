
name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Optional Playwright spec path, for example e2e/auth.spec.ts"
        required: false
        default: "e2e/auth.spec.ts e2e/dashboard.spec.ts"

# Node.js 24 native runtimes active via v6+ actions
jobs:
  test:
    name: Playwright (apps/web)
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: craftmyfunnel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    
    - name: Install dependencies
      run: npm ci --workspace apps/web --include-workspace-root --no-audit --no-fund --legacy-peer-deps
    
    - name: Generate Prisma Client & Apply Migrations
      working-directory: apps/web
      run: |
        npx prisma generate --config prisma/prisma.config.ts --schema prisma/schema.prisma
        npx prisma migrate deploy --config prisma/prisma.config.ts --schema prisma/schema.prisma
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/craftmyfunnel
        DIRECT_URL: postgresql://postgres:password@localhost:5432/craftmyfunnel
    
    - name: Create test user
      working-directory: apps/web
      run: npx tsx scripts/create-test-user.ts
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/craftmyfunnel
        DIRECT_URL: postgresql://postgres:password@localhost:5432/craftmyfunnel
    
    - name: Build application
      working-directory: apps/web
      run: npm run build
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/craftmyfunnel
        DIRECT_URL: postgresql://postgres:password@localhost:5432/craftmyfunnel
        NEXTAUTH_SECRET: ci-playwright-secret
        METRICS_TOKEN: ci-metrics-token
        NEXTAUTH_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:3001
        REDIS_URL: redis://localhost:6379
    
    - name: Install Playwright Browsers
      working-directory: apps/web
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      working-directory: apps/web
      run: npx playwright test ${{ github.event.inputs.spec }}
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/craftmyfunnel
        DIRECT_URL: postgresql://postgres:password@localhost:5432/craftmyfunnel
        NEXTAUTH_SECRET: ci-playwright-secret
        NEXTAUTH_URL: http://localhost:3000
        METRICS_TOKEN: ci-metrics-token
        TEST_USER_EMAIL: audit_user@example.com
        TEST_USER_PASSWORD: AuditPassword123!
        REDIS_URL: redis://localhost:6379
    
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: playwright-report
        path: apps/web/playwright-report/
        retention-days: 30
