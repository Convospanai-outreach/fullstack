name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-build:
    name: Web Build (apps/web)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: convospan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json

    - name: Install dependencies
      working-directory: apps/web
      run: npm ci --workspaces=false

    - name: Security Audit
      working-directory: apps/web
      continue-on-error: true
      run: npm audit --audit-level=high --omit=dev

    - name: Generate Prisma Client
      working-directory: apps/web
      run: npx prisma generate
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"

    - name: Push Schema (Ephemeral CI DB)
      working-directory: apps/web
      run: npx prisma db push --accept-data-loss
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"

    - name: Type Check
      working-directory: apps/web
      run: npm run typecheck

    - name: Build
      working-directory: apps/web
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PHASE: phase-production-build
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        SKIP_ENV_VALIDATION: "true"
        REDIS_URL: "redis://localhost:6379"

  api-typecheck:
    name: API Strict Typecheck (apps/api)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: apps/api/package-lock.json

    - name: Install dependencies
      working-directory: apps/api
      run: npm ci --workspaces=false

    - name: Generate Prisma Client
      working-directory: apps/api
      run: npx prisma generate
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"

    - name: Type Check
      working-directory: apps/api
      run: npm run typecheck --workspaces=false

    - name: Build
      working-directory: apps/api
      run: npm run build --workspaces=false

  docker-smoke:
    name: Docker Build Smoke (api + edge-fastapi)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Build API image
      run: docker build -t convospan-api-ci -f apps/api/Dockerfile apps/api

    - name: Build Edge image
      run: docker build -t convospan-edge-ci -f apps/edge-fastapi/Dockerfile apps/edge-fastapi
