name: CI

# General build/typecheck/docker-smoke gate — web-build, api-typecheck,
# docker-smoke. Three sibling workflows cover distinct concerns and
# deliberately are NOT merged into this one (see tech-debt-audit
# 2026-08-20 #10): verify.yml (migration-safety invariant scanning),
# production-gate.yml (deploy-readiness checks), render-parity-build.yml
# (Render-specific build parity). All four duplicate the same
# detect-docs-only/docs-only-validation boilerplate — a real DRY gap,
# flagged but not consolidated here (would need a reusable workflow).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Node.js 24 native runtimes active via v6+ actions

jobs:
  detect-docs-only:
    name: Docs-only Change Detection
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Classify changed files
      id: classify
      shell: bash
      run: |
        set -euo pipefail
        event="${{ github.event_name }}"
        changed=""

        if [[ "$event" == "pull_request" ]]; then
          git fetch --no-tags --prune origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)" || changed=""
        elif [[ "$event" == "push" ]]; then
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
            changed="$(git diff --name-only "$before" "$after")"
          fi
        fi

        docs_only=true
        if [[ -z "$changed" ]]; then
          docs_only=false
        else
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/*|README.md|.github/pull_request_template.md|.github/ISSUE_TEMPLATE/*)
                ;;
              *.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done <<< "$changed"
        fi

        echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
        echo "Docs-only classification: $docs_only" >> "$GITHUB_STEP_SUMMARY"
        if [[ -n "$changed" ]]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed files:" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$changed" >> "$GITHUB_STEP_SUMMARY"
        fi

  docs-only-validation:
    name: Docs-only Validation
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-22.04
    steps:
    - name: Confirm docs-only guard
      run: |
        echo "Docs-only change set detected."
        echo "Skipping Web Build, API Strict Typecheck, and Docker Build Smoke."

  web-build:
    name: Web Build (apps/web)
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: craftmyfunnel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Prisma Schema Drift Gate
      run: node scripts/db/compare-prisma-schemas.mjs

    - name: Web Import Guards
      run: |
        node scripts/check-web-prisma-imports.mjs
        node scripts/check-web-route-db-imports.mjs
        node scripts/check-web-auth-mode.mjs

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci --workspace apps/web --include-workspace-root --no-audit --no-fund --legacy-peer-deps

    - name: Security Audit
      working-directory: apps/web
      run: node ../../scripts/audit-with-allowlist.mjs

    - name: Generate Prisma Client
      working-directory: apps/web
      run: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci" DIRECT_URL="postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci" npx prisma generate --config prisma/prisma.config.ts --schema prisma/schema.prisma

    - name: Setup Database Schema
      working-directory: apps/web
      run: npx prisma migrate deploy --config prisma/prisma.config.ts --schema prisma/schema.prisma
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"

    - name: Live DB Concurrency Verification
      working-directory: apps/web
      run: node scripts/test-db-concurrency.mjs
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"

    - name: Type Check
      working-directory: apps/web
      run: npm run typecheck

    - name: Lint
      working-directory: apps/web
      run: npm run lint

    - name: Unit Tests
      working-directory: apps/web
      run: npm run test:unit
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        REDIS_URL: "redis://localhost:6379"

    # Tests that live next to their route/service under src/ (roadmap I-14).
    # Unit Tests above only runs tests/unit, so these never ran in CI.
    - name: Colocated Tests
      working-directory: apps/web
      run: npm run test:colocated
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        REDIS_URL: "redis://localhost:6379"

    - name: Coverage Gate
      working-directory: apps/web
      run: npm run test:coverage
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        REDIS_URL: "redis://localhost:6379"

    - name: Build
      working-directory: apps/web
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PHASE: phase-production-build
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        SKIP_ENV_VALIDATION: "true"
        REDIS_URL: "redis://localhost:6379"

  api-typecheck:
    name: API Strict Typecheck (apps/api)
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: craftmyfunnel_api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci --workspace apps/api --include-workspace-root --no-audit --no-fund --legacy-peer-deps

    # Same allowlisted high/critical gate the web jobs run. Run inside a workspace
    # folder, `npm audit` only covers that workspace's tree, so the web jobs never
    # covered dependencies that only apps/api uses.
    - name: Security Audit
      working-directory: apps/api
      run: node ../../scripts/audit-with-allowlist.mjs

    - name: Generate Prisma Client
      working-directory: apps/api
      run: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci" DIRECT_URL="postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci" npx prisma generate --config prisma/prisma.config.ts --schema prisma/schema.prisma

    - name: Setup API Database Schema
      working-directory: apps/api
      run: npx prisma migrate deploy --config prisma/prisma.config.ts --schema prisma/schema.prisma
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"

    - name: Type Check
      working-directory: apps/api
      run: npm run typecheck

    - name: Build
      working-directory: apps/api
      run: npm run build

    - name: API Tests
      working-directory: apps/api
      run: npm run test
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        REDIS_URL: "redis://localhost:6379"

    - name: API Coverage Gate
      working-directory: apps/api
      run: npm run test:coverage
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        REDIS_URL: "redis://localhost:6379"

  docker-smoke:
    name: Docker Build Smoke (api required, edge-fastapi optional)
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Build API image
      run: docker build -t craftmyfunnel-api-ci -f apps/api/Dockerfile .

    - name: Build Edge image (optional)
      continue-on-error: true
      run: docker build -t craftmyfunnel-edge-ci -f apps/edge-fastapi/Dockerfile apps/edge-fastapi

  # Builds the production API image and boots it the way the Oracle VMs do
  # (NODE_ENV=production, its own user, the same read-only CA bind mount), once
  # with the api command and once with the worker command, against a migrated
  # Postgres. GET /health must return 200, and the worker must finish a full
  # maintenance pass and render a PDF with Chromium, all as a non-root user. An
  # image that builds but can't start fails here, not on deploy.
  api-image-boot:
    name: API Image Boot (/health)
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: craftmyfunnel_boot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Build API image
      run: docker build -t craftmyfunnel-api-boot -f apps/api/Dockerfile .

    - name: Migrate, then boot the api and worker containers
      run: |
        # Mounted the way deploy/oracle/docker-compose.*.yml mounts it: read-only,
        # root-owned, mode 644 (docs/deployment/oracle-vm-deployment.md).
        mkdir boot-config
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /dev/null -days 1 \
          -subj "/CN=api-image-boot" -out boot-config/prod-ca-2021.crt
        sudo chown root:root boot-config/prod-ca-2021.crt
        sudo chmod 644 boot-config/prod-ca-2021.crt
        mount="$PWD/boot-config/prod-ca-2021.crt:/app/prod-ca-2021.crt:ro"

        # Throwaway values: the boot-time secret check rejects the samples.
        cat > boot.env <<EOF
        DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/craftmyfunnel_boot_ci
        DIRECT_URL=postgresql://postgres:postgres@127.0.0.1:5432/craftmyfunnel_boot_ci
        NEXTAUTH_SECRET=$(openssl rand -hex 32)
        ENCRYPTION_KEY=$(openssl rand -hex 32)
        CRON_SECRET=$(openssl rand -hex 16)
        EOF

        # Migrate first, as deploy-oracle.yml does, so the worker's queries hit real
        # tables. Production migrates from the deploy runner, not from this image, so
        # this setup runs as root rather than making it part of what the job tests.
        docker run --rm --network host --env-file boot.env --user root craftmyfunnel-api-boot \
          npx prisma migrate deploy --config prisma/prisma.config.ts --schema prisma/schema.prisma

        # --memory mirrors the Oracle VMs' container limit (mem_limit: 640m), so an
        # out-of-memory kill fails this job instead of a production host.
        docker run -d --name api-boot --network host --env-file boot.env -v "$mount" \
          --memory=640m --memory-swap=640m \
          craftmyfunnel-api-boot
        # Same command as deploy/oracle/docker-compose.worker.yml.
        docker run -d --name worker-boot --network host --env-file boot.env -v "$mount" \
          --memory=640m --memory-swap=640m \
          craftmyfunnel-api-boot node ../../node_modules/tsx/dist/cli.mjs src/workers/start-workers.ts

    - name: Require GET /health to return 200
      run: |
        for attempt in $(seq 1 60); do
          code=$(curl -s --max-time 5 -o health.json -w '%{http_code}' http://127.0.0.1:3001/health || true)
          if [ "$code" = "200" ]; then
            cat health.json
            exit 0
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' api-boot)" != "true" ]; then
            echo "::error::The API container exited before /health returned 200."
            exit 1
          fi
          sleep 2
        done
        echo "::error::/health did not return 200 within 120s (last status: ${code})."
        exit 1

    - name: Require a full worker pass without errors
      run: |
        # The loop's first pass runs every maintenance task against the database and
        # ends with the retention sweep's dry run. A failing task logs
        # "[Worker] Loop error" and cuts the pass short.
        for attempt in $(seq 1 60); do
          logs=$(docker logs worker-boot 2>&1)
          if grep -q "Loop error" <<< "$logs"; then
            echo "::error::The worker loop failed."
            grep "Loop error" <<< "$logs" | head -n 5
            exit 1
          fi
          if grep -q "\[Retention\]" <<< "$logs"; then
            # Give the sweep's remaining tables a moment to log.
            sleep 3
            logs=$(docker logs worker-boot 2>&1)
            # No migration creates the Landing* tables (production got them from an
            # earlier out-of-band `prisma db push`; see migration
            # 20260916100000_campaign_landing_icp), so this fresh database lacks
            # LandingEvent. Only that exact failure is let through.
            known_gap='LandingEvent sweep failed.*does not exist'
            if grep -E "Loop error|sweep failed" <<< "$logs" | grep -Ev "$known_gap"; then
              echo "::error::The worker's first pass logged an error."
              exit 1
            fi
            if grep -qE "$known_gap" <<< "$logs"; then
              echo "::warning::LandingEvent is missing from the migrated CI database: no migration creates the Landing* tables."
            fi
            exit 0
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' worker-boot)" != "true" ]; then
            echo "::error::The worker container exited during its first pass."
            exit 1
          fi
          sleep 2
        done
        echo "::error::The worker did not finish its first pass within 120s."
        exit 1

    - name: Require the api container to boot within its memory budget
      env:
        # api-main runs ~254-274 MiB in production on a 954 MB host that also runs
        # Caddy, fail2ban and Docker. #579 pushed it to ~371 MiB (jsdom loaded at
        # boot) and the host OOM-hung (see the OPEN-270 REVERTED note); the 640m
        # container cap alone would not have caught that. Raise this only together
        # with a matching host-capacity check.
        API_BOOT_MEM_BUDGET_MIB: "330"
      run: |
        to_mib() {
          awk -v v="$1" 'BEGIN {
            n = v + 0; u = v; sub(/^[0-9.]+/, "", u)
            if (u == "GiB") n *= 1024; else if (u == "KiB") n /= 1024; else if (u == "B") n /= 1048576
            printf "%d", n
          }'
        }
        mem_of() { docker stats --no-stream --format '{{.MemUsage}}' "$1" | awk '{print $1}'; }
        # Let post-boot allocation settle after /health and the worker pass.
        sleep 10
        for container in api-boot worker-boot; do
          usage=$(mem_of "$container")
          echo "${container}: ${usage} ($(to_mib "$usage") MiB)"
        done
        api_mib=$(to_mib "$(mem_of api-boot)")
        if [ "$api_mib" -gt "$API_BOOT_MEM_BUDGET_MIB" ]; then
          echo "::error::api-boot uses ${api_mib} MiB after boot, over the ${API_BOOT_MEM_BUDGET_MIB} MiB budget. A new boot-time dependency may not fit the 1 GB api-main host."
          exit 1
        fi
        echo "api-boot is within budget (${api_mib}/${API_BOOT_MEM_BUDGET_MIB} MiB)."

    - name: Require non-root processes that can read the CA mount
      run: |
        for container in api-boot worker-boot; do
          uid=$(docker exec "$container" id -u)
          echo "${container} runs as uid ${uid}"
          test "$uid" != "0"
          docker exec "$container" test -r /app/prod-ca-2021.crt
        done

    - name: Require Chromium to render a PDF in the worker
      run: |
        # Same launch args as invoicePdfRenderer.ts, which only runs in the worker.
        docker exec worker-boot node -e '
          require("puppeteer")
            .launch({ headless: true, args: ["--no-sandbox", "--disable-setuid-sandbox"] })
            .then(async (browser) => {
              const page = await browser.newPage();
              await page.setContent("<p>api-image-boot</p>");
              const pdf = await page.pdf();
              await browser.close();
              if (!pdf.length) throw new Error("Chromium returned an empty PDF");
              console.log(`Rendered a ${pdf.length}-byte PDF as uid ${process.getuid()}`);
            })
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
        '

    - name: Container logs
      if: always()
      run: |
        for container in api-boot worker-boot; do
          echo "::group::${container}"
          docker logs "$container" 2>&1 | tail -n 200 || true
          echo "::endgroup::"
        done

    - name: Remove containers
      if: always()
      run: docker rm -f api-boot worker-boot > /dev/null 2>&1 || true

  ci-gate:
    name: CI Gate
    needs: [detect-docs-only, docs-only-validation, web-build, api-typecheck, docker-smoke, api-image-boot]
    runs-on: ubuntu-22.04
    if: always()
    steps:
    - name: Check required jobs
      run: |
        if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
          if [ "${{ needs.docs-only-validation.result }}" != "success" ]; then
            echo "::error::Docs-only validation did not complete successfully."
            exit 1
          fi
        else
          if [ "${{ needs.web-build.result }}" != "success" ]; then
            echo "::error::Web Build did not complete successfully."
            exit 1
          fi
          if [ "${{ needs.api-typecheck.result }}" != "success" ]; then
            echo "::error::API Strict Typecheck did not complete successfully."
            exit 1
          fi
          if [ "${{ needs.docker-smoke.result }}" != "success" ]; then
            echo "::error::Docker Build Smoke did not complete successfully."
            exit 1
          fi
          if [ "${{ needs.api-image-boot.result }}" != "success" ]; then
            echo "::error::API Image Boot did not complete successfully."
            exit 1
          fi
        fi
        echo "CI Gate passed."
