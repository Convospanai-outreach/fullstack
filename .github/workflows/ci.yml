name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Node.js 24 native runtimes active via v6+ actions

jobs:
  detect-docs-only:
    name: Docs-only Change Detection
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Classify changed files
      id: classify
      shell: bash
      run: |
        set -euo pipefail
        event="${{ github.event_name }}"
        changed=""

        if [[ "$event" == "pull_request" ]]; then
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
        elif [[ "$event" == "push" ]]; then
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
            changed="$(git diff --name-only "$before" "$after")"
          fi
        fi

        docs_only=true
        if [[ -z "$changed" ]]; then
          docs_only=false
        else
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/*|README.md|.github/pull_request_template.md|.github/ISSUE_TEMPLATE/*)
                ;;
              *.md)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done <<< "$changed"
        fi

        echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
        echo "Docs-only classification: $docs_only" >> "$GITHUB_STEP_SUMMARY"
        if [[ -n "$changed" ]]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed files:" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$changed" >> "$GITHUB_STEP_SUMMARY"
        fi

  docs-only-validation:
    name: Docs-only Validation
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-22.04
    steps:
    - name: Confirm docs-only guard
      run: |
        echo "Docs-only change set detected."
        echo "Skipping Web Build, API Strict Typecheck, and Docker Build Smoke."

  web-build:
    name: Web Build (apps/web)
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: craftmyfunnel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Web Import Guards
      run: |
        node scripts/check-web-prisma-imports.mjs
        node scripts/check-web-route-db-imports.mjs
        node scripts/check-web-auth-mode.mjs

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci --workspace apps/web --include-workspace-root --no-audit --no-fund --legacy-peer-deps

    - name: Security Audit
      working-directory: apps/web
      run: npm audit --audit-level=high --omit=dev || true

    - name: Generate Prisma Client
      working-directory: apps/web
      run: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci" DIRECT_URL="postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci" npx prisma generate --config prisma/prisma.config.ts --schema prisma/schema.prisma

    - name: Setup Database Schema
      working-directory: apps/web
      run: npx prisma migrate deploy --config prisma/prisma.config.ts --schema prisma/schema.prisma
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"

    - name: Type Check
      working-directory: apps/web
      run: npm run typecheck

    - name: Lint
      working-directory: apps/web
      run: npm run lint

    - name: Unit Tests
      working-directory: apps/web
      run: npm run test:unit
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        REDIS_URL: "redis://localhost:6379"

    - name: Coverage Gate
      working-directory: apps/web
      run: npm run test:coverage
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        REDIS_URL: "redis://localhost:6379"

    - name: Build
      working-directory: apps/web
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PHASE: phase-production-build
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_ci"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        SKIP_ENV_VALIDATION: "true"
        REDIS_URL: "redis://localhost:6379"

  api-typecheck:
    name: API Strict Typecheck (apps/api)
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: craftmyfunnel_api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci --workspace apps/api --include-workspace-root --no-audit --no-fund --legacy-peer-deps

    - name: Generate Prisma Client
      working-directory: apps/api
      run: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci" DIRECT_URL="postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci" npx prisma generate --config prisma/prisma.config.ts --schema prisma/schema.prisma

    - name: Setup API Database Schema
      working-directory: apps/api
      run: npx prisma migrate deploy --config prisma/prisma.config.ts --schema prisma/schema.prisma
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"

    - name: Type Check
      working-directory: apps/api
      run: npm run typecheck

    - name: Build
      working-directory: apps/api
      run: npm run build

    - name: API Tests
      working-directory: apps/api
      run: npm run test
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        REDIS_URL: "redis://localhost:6379"

    - name: API Coverage Gate
      working-directory: apps/api
      run: npm run test:coverage
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/craftmyfunnel_api_ci"
        REDIS_URL: "redis://localhost:6379"

  docker-smoke:
    name: Docker Build Smoke (api required, edge-fastapi optional)
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Build API image
      run: docker build -t craftmyfunnel-api-ci -f apps/api/Dockerfile .

    - name: Build Edge image (optional)
      continue-on-error: true
      run: docker build -t craftmyfunnel-edge-ci -f apps/edge-fastapi/Dockerfile apps/edge-fastapi
