name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate
      env:
        # Use a dummy DATABASE_URL so Prisma generate works without a real DB
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"

    - name: Type Check
      run: npm run typecheck

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        # Skip actual DB connection at build time via NEXT_PHASE
        NEXT_PHASE: phase-production-build
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        # Stub out all external services for CI build
        SKIP_ENV_VALIDATION: "true"