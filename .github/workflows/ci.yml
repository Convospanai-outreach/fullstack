name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Node.js 24 native runtimes active via v6+ actions

jobs:
  web-build:
    name: Web Build (apps/web)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci --workspace apps/web --include-workspace-root --no-audit --no-fund --legacy-peer-deps

    - name: Security Audit
      working-directory: apps/web
      continue-on-error: true
      run: npm audit --audit-level=critical --omit=dev

    - name: Generate Prisma Client
      working-directory: apps/web
      run: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/dummy" DIRECT_URL="postgresql://postgres:postgres@localhost:5432/dummy" npx prisma generate --config prisma/prisma.config.ts --schema prisma/schema.prisma

    - name: Type Check
      working-directory: apps/web
      run: npm run typecheck

    - name: Build
      working-directory: apps/web
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PHASE: phase-production-build
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
        DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dummy"
        NEXTAUTH_SECRET: ci-secret-not-real
        NEXTAUTH_URL: http://localhost:3000
        SKIP_ENV_VALIDATION: "true"
        REDIS_URL: "redis://localhost:6379"

  api-typecheck:
    name: API Strict Typecheck (apps/api)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci --workspace apps/api --include-workspace-root --no-audit --no-fund --legacy-peer-deps

    - name: Generate Prisma Client
      working-directory: apps/api
      run: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/dummy" DIRECT_URL="postgresql://postgres:postgres@localhost:5432/dummy" npx prisma generate

    - name: Type Check
      working-directory: apps/api
      run: npm run typecheck

    - name: Build
      working-directory: apps/api
      run: npm run build

  docker-smoke:
    name: Docker Build Smoke (api required, edge-fastapi optional)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Runtime Files Preflight
      run: node scripts/check-critical-runtime-files.mjs

    - name: Build API image
      run: docker build -t convospan-api-ci -f apps/api/Dockerfile .

    - name: Build Edge image (optional)
      continue-on-error: true
      run: docker build -t convospan-edge-ci -f apps/edge-fastapi/Dockerfile apps/edge-fastapi
