name: Production Readiness Gate

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  workflow_dispatch:

# Node.js 24 native runtimes active via v6+ actions

jobs:
  detect-docs-only:
    name: Docs-only Change Detection
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          changed=""

          if [[ "$event" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          elif [[ "$event" == "push" ]]; then
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              changed="$(git diff --name-only "$before" "$after")"
            fi
          fi

          docs_only=true
          if [[ -z "$changed" ]]; then
            docs_only=false
          else
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                docs/*|README.md|.github/pull_request_template.md|.github/ISSUE_TEMPLATE/*)
                  ;;
                *.md)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done <<< "$changed"
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Docs-only classification: $docs_only" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$changed" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Changed files:" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$changed" >> "$GITHUB_STEP_SUMMARY"
          fi

  docs-only-validation:
    name: Docs-only Validation
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm docs-only production gate skip
        run: |
          echo "Docs-only change set detected."
          echo "Skipping Production Readiness Gate."

  validate-readiness:
    name: Production Stability Audit (apps/web)
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: craftmyfunnel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Web Import Guards
        run: |
          node scripts/check-web-prisma-imports.mjs
          node scripts/check-web-route-db-imports.mjs
          node scripts/check-web-auth-mode.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --workspace apps/web --include-workspace-root --no-audit --no-fund --legacy-peer-deps

      - name: Security Audit
        working-directory: apps/web
        run: npm audit --audit-level=high --omit=dev

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate --config prisma/prisma.config.ts --schema prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"

      - name: Setup Database
        working-directory: apps/web
        run: npx prisma migrate deploy --config prisma/prisma.config.ts --schema prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"

      - name: Run Unit Tests
        working-directory: apps/web
        run: npm run test:unit
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
          REDIS_URL: "redis://localhost:6379"

      - name: Run Coverage Gate
        working-directory: apps/web
        run: npm run test:coverage
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
          REDIS_URL: "redis://localhost:6379"

      - name: Seed Readiness Data
        working-directory: apps/web
        run: npm run readiness:seed
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"

      - name: Execute Production Readiness Audit
        id: audit
        working-directory: apps/web
        run: npm run readiness:audit
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/craftmyfunnel"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
          METRICS_TOKEN: ci-metrics-token
          NODE_ENV: production
          GEMINI_API_KEY: "ci-dummy-key"

      - name: Hardening Compliance Report
        if: always()
        run: |
          echo "### Production Readiness Report" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.audit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Audit completed at $(date)" >> $GITHUB_STEP_SUMMARY
