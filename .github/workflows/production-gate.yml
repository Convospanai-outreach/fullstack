name: Production Readiness Gate

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-readiness:
    name: Production Stability Audit
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: convospan
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"

      - name: Seed Readiness Data
        run: npm run readiness:seed
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"

      - name: Execute Production Readiness Audit
        id: audit
        run: npm run readiness:audit
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/convospan"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Hardening Compliance Report
        if: always()
        run: |
          echo "### Production Readiness Report" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ steps.audit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Audit completed at $(date)" >> $GITHUB_STEP_SUMMARY
