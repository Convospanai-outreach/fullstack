<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CraftMyFunnel Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>CraftMyFunnel</h1>
        <p>LinkedIn visible profile capture</p>
      </div>
    </header>

    <section class="actions">
      <button id="captureProfile" class="primary" type="button">Capture Visible Profile</button>
    </section>

    <section class="capture" aria-label="Latest captured profile">
      <div class="section-title">Latest Capture</div>
      <dl id="latestCapture">
        <dt>Name</dt>
        <dd id="captureName">-</dd>
        <dt>Headline</dt>
        <dd id="captureHeadline">-</dd>
        <dt>Company</dt>
        <dd id="captureCompany">-</dd>
        <dt>Profile URL</dt>
        <dd id="captureUrl">-</dd>
      </dl>
      <button id="copyCapture" class="secondary" type="button">Copy Capture</button>
    </section>

    <section class="activity">
      <div class="section-title">Activity Log</div>
      <ol id="activityLog"></ol>
    </section>

    <footer id="statusMsg">V1 approval scope: visible LinkedIn profile capture only.</footer>
  </main>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
