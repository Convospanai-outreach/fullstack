<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CraftMyFunnel Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>CraftMyFunnel</h1>
        <p>LinkedIn-assisted lead capture</p>
      </div>
      <button id="pauseToggle" class="icon-btn" type="button" title="Pause or resume polling">Pause</button>
    </header>

    <section class="settings">
      <label>
        API base
        <input id="apiBaseInput" type="url" placeholder="http://localhost:3000/api" />
      </label>
      <label>
        API token
        <input id="tokenInput" type="password" placeholder="Paste CraftMyFunnel token" />
      </label>
      <label>
        Extension key
        <input id="extensionKeyInput" type="password" placeholder="CraftMyFunnel extension key" />
      </label>
      <label>
        Team ID
        <input id="teamIdInput" type="text" placeholder="Optional team ID" />
      </label>
      <button id="saveSettings" class="primary" type="button">Save Settings</button>
    </section>

    <section class="stats" aria-label="Extension stats">
      <div><strong id="leadsAdded">0</strong><span>Leads</span></div>
      <div><strong id="draftsInserted">0</strong><span>Drafts</span></div>
      <div><strong id="tasksCompleted">0</strong><span>Tasks</span></div>
      <div><strong id="errors">0</strong><span>Errors</span></div>
    </section>

    <section class="actions">
      <button id="addLead" class="secondary" type="button">Add to CMF</button>
      <textarea id="draftText" rows="4" placeholder="Draft note to insert into the active LinkedIn text box"></textarea>
      <button id="insertDraft" class="secondary" type="button">Insert Draft</button>
      <select id="manualTaskType" aria-label="Manual task label">
        <option value="LINKEDIN_TASK">LINKEDIN_TASK</option>
        <option value="WHATSAPP_TASK">WHATSAPP_TASK</option>
        <option value="CALL_TASK">CALL_TASK</option>
      </select>
      <button id="logTask" class="secondary" type="button">Log Manual LinkedIn Task</button>
    </section>

    <section class="activity">
      <div class="section-title">Activity Log</div>
      <ol id="activityLog"></ol>
    </section>

    <footer id="statusMsg">Ready</footer>
  </main>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
