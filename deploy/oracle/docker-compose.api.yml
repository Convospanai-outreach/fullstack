services:
  api:
    image: ghcr.io/convospanai-outreach/fullstack/api:latest
    container_name: api-main
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./config/prod-ca-2021.crt:/app/prod-ca-2021.crt:ro
